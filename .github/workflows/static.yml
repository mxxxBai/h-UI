<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收银端 - 设备租赁列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f5f7fa;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .header-bar {
            background-color: #ffdd00;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            display: flex;
            align-items: center;
        }
        .logo img {
            height: 30px;
            margin-right: 10px;
        }
        .nav-icons {
            display: flex;
            gap: 15px;
        }
        .nav-icons a {
            color: #333;
            text-decoration: none;
        }
        .service-icons {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            text-align: center;
        }
        .service-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 25%;
        }
        .service-icon .icon-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .service-icon .icon-text {
            font-size: 12px;
            color: #666;
        }
        .category-tabs {
            display: flex;
            overflow-x: auto;
            margin: 15px 0;
            border-bottom: 1px solid #eee;
        }
        .category-tab {
            padding: 10px 15px;
            white-space: nowrap;
            font-size: 14px;
            color: #666;
            position: relative;
        }
        .category-tab.active {
            color: #333;
            font-weight: bold;
        }
        .category-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #ffdd00;
        }
        .search-bar {
            position: relative;
            margin: 15px;
        }
        .search-bar input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
        }
        .search-bar .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }
        .device-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 15px;
        }
        .device-card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            position: relative;
        }
        .device-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .device-info {
            padding: 10px;
        }
        .device-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .device-price {
            font-size: 12px;
            color: #ff6b00;
        }
        .device-status {
            font-size: 12px;
            color: #999;
        }
        .rent-button {
            background-color: #ffdd00;
            color: #333;
            border: none;
            border-radius: 15px;
            padding: 5px 10px;
            font-size: 12px;
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-badge.in-use {
            background-color: #e6f7ff;
            color: #1890ff;
        }
        .status-badge.pending-payment {
            background-color: #fff2e8;
            color: #fa541c;
        }
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 16px;
            height: 16px;
            background-color: #ff4d4f;
            color: white;
            border-radius: 50%;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pending-orders {
            background-color: #fff2e8;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #fa541c;
        }
        .pending-orders-title {
            font-size: 14px;
            font-weight: bold;
            color: #fa541c;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .pending-orders-title i {
            margin-right: 5px;
        }
        .pending-order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ffe7e0;
        }
        .pending-order-item:last-child {
            border-bottom: none;
        }
        .pending-order-info {
            flex: 1;
        }
        .pending-order-name {
            font-size: 14px;
            margin-bottom: 5px;
        }
        .pending-order-time {
            font-size: 12px;
            color: #999;
        }
        .pay-button {
            background-color: #fa541c;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 5px 10px;
            font-size: 12px;
        }
        .current-rentals {
            background-color: #e6f7ff;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #1890ff;
        }
        .current-rentals-title {
            font-size: 14px;
            font-weight: bold;
            color: #1890ff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .current-rentals-title i {
            margin-right: 5px;
        }
        .rental-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #bae7ff;
        }
        .rental-item:last-child {
            border-bottom: none;
        }
        .rental-info {
            flex: 1;
        }
        .rental-name {
            font-size: 14px;
            margin-bottom: 5px;
        }
        .rental-time {
            font-size: 12px;
            color: #999;
        }
        .rental-actions {
            display: flex;
            gap: 10px;
        }
        .renew-button {
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 5px 10px;
            font-size: 12px;
        }
        .return-button {
            background-color: #52c41a;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 5px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="header-bar">
        <div class="logo">
            <img src="https://placeholder.pics/svg/30x30/FFDD00-FFDD00/000000-000000/logo" alt="Logo">
            <span>海试门店</span>
        </div>
        <div class="nav-icons">
            <a href="#" class="position-relative">
                <i class="bi bi-bell"></i>
                <span class="notification-badge">3</span>
            </a>
            <a href="#"><i class="bi bi-person"></i></a>
            <a href="#"><i class="bi bi-list"></i></a>
        </div>
    </div>

    <!-- 服务图标 -->
    <div class="service-icons">
        <div class="service-icon">
            <div class="icon-circle">
                <i class="bi bi-shop"></i>
            </div>
            <div class="icon-text">门店介绍</div>
        </div>
        <div class="service-icon">
            <div class="icon-circle">
                <i class="bi bi-cup-hot"></i>
            </div>
            <div class="icon-text">点餐</div>
        </div>
        <div class="service-icon">
            <div class="icon-circle">
                <i class="bi bi-laptop"></i>
            </div>
            <div class="icon-text">设备租赁</div>
        </div>
        <div class="service-icon">
            <div class="icon-circle">
                <i class="bi bi-headset"></i>
            </div>
            <div class="icon-text">客服</div>
        </div>
    </div>

    <!-- 待支付订单提醒 -->
    <div class="pending-orders">
        <div class="pending-orders-title">
            <i class="bi bi-exclamation-triangle-fill"></i>
            待支付订单 (2)
        </div>
        <div class="pending-order-item">
            <div class="pending-order-info">
                <div class="pending-order-name">沃丁 60HE+ 机械键盘</div>
                <div class="pending-order-time">创建于 10:30 · 剩余支付时间: 14:59</div>
            </div>
            <button class="pay-button">去支付</button>
        </div>
        <div class="pending-order-item">
            <div class="pending-order-info">
                <div class="pending-order-name">咖啡杯</div>
                <div class="pending-order-time">创建于 09:15 · 剩余支付时间: 04:25</div>
            </div>
            <button class="pay-button">去支付</button>
        </div>
    </div>

    <!-- 当前租赁中的设备 -->
    <div class="current-rentals">
        <div class="current-rentals-title">
            <i class="bi bi-clock-history"></i>
            当前租赁 (2)
        </div>
        <div class="rental-item">
            <div class="rental-info">
                <div class="rental-name">沃丁 60HE+ 机械键盘</div>
                <div class="rental-time">剩余时间: 1小时25分钟 · 已续租1次</div>
            </div>
            <div class="rental-actions">
                <button class="renew-button">续租</button>
                <button class="return-button">归还</button>
            </div>
        </div>
        <div class="rental-item">
            <div class="rental-info">
                <div class="rental-name">咖啡杯</div>
                <div class="rental-time">剩余时间: 30分钟</div>
            </div>
            <div class="rental-actions">
                <button class="renew-button">续租</button>
                <button class="return-button">归还</button>
            </div>
        </div>
    </div>

    <!-- 分类标签 -->
    <div class="category-tabs">
        <div class="category-tab active">全部</div>
        <div class="category-tab">键盘</div>
        <div class="category-tab">耳机</div>
        <div class="category-tab">咖啡杯</div>
        <div class="category-tab">鼠标</div>
        <div class="category-tab">充电宝</div>
    </div>

    <!-- 搜索栏 -->
    <div class="search-bar">
        <input type="text" placeholder="搜索设备...">
        <i class="bi bi-search search-icon"></i>
    </div>

    <!-- 设备列表 -->
    <div class="device-grid">
        <!-- 设备1 -->
        <div class="device-card">
            <div class="device-image">
                <img src="https://placeholder.pics/svg/100x100/DEDEDE-DEDEDE/000000-000000/键盘" alt="沃丁键盘">
            </div>
            <div class="device-info">
                <div class="device-name">沃丁 60HE+ 机械键盘</div>
                <div class="device-price">¥5/小时 · 免费1小时</div>
                <div class="device-status">库存: 1台</div>
                <button class="rent-button">租赁</button>
            </div>
        </div>
        
        <!-- 设备2 - 租赁中 -->
        <div class="device-card">
            <div class="device-image">
                <img src="https://placeholder.pics/svg/100x100/DEDEDE-DEDEDE/000000-000000/键盘" alt="沃丁键盘">
            </div>
            <div class="status-badge in-use">租赁中</div>
            <div class="device-info">
                <div class="device-name">沃丁 60HE+ 机械键盘</div>
                <div class="device-price">¥5/小时 · 免费1小时</div>
                <div class="device-status">库存: 0台</div>
            </div>
        </div>
        
        <!-- 设备3 - 待支付 -->
        <div class="device-card">
            <div class="device-image">
                <img src="https://placeholder.pics/svg/100x100/DEDEDE-DEDEDE/000000-000000/咖啡" alt="咖啡杯">
            </div>
            <div class="status-badge pending-payment">待支付</div>
            <div class="device-info">
                <div class="device-name">咖啡杯</div>
                <div class="device-price">¥3/小时 · 免费30分钟</div>
                <div class="device-status">库存: 5台</div>
            </div>
        </div>
        
        <!-- 设备4 -->
        <div class="device-card">
            <div class="device-image">
                <img src="https://placeholder.pics/svg/100x100/DEDEDE-DEDEDE/000000-000000/耳机" alt="耳机">
            </div>
            <div class="device-info">
                <div class="device-name">专业游戏耳机</div>
                <div class="device-price">¥4/小时 · 免费1小时</div>
                <div class="device-status">库存: 3台</div>
                <button class="rent-button">租赁</button>
            </div>
        </div>
        
        <!-- 设备5 -->
        <div class="device-card">
            <div class="device-image">
                <img src="https://placeholder.pics/svg/100x100/DEDEDE-DEDEDE/000000-000000/鼠标" alt="鼠标">
            </div>
            <div class="device-info">
                <div class="device-name">卓威鼠标</div>
                <div class="device-price">¥4/小时 · 免费1小时</div>
                <div class="device-status">库存: 2台</div>
                <button class="rent-button">租赁</button>
            </div>
        </div>
        
        <!-- 设备6 -->
        <div class="device-card">
            <div class="device-image">
                <img src="https://placeholder.pics/svg/100x100/DEDEDE-DEDEDE/000000-000000/咖啡" alt="咖啡杯">
            </div>
            <div class="device-info">
                <div class="device-name">咖啡杯</div>
                <div class="device-price">¥3/小时 · 免费30分钟</div>
                <div class="device-status">库存: 5台</div>
                <button class="rent-button">租赁</button>
            </div>
        </div>
    </div>
</body>
</html>
